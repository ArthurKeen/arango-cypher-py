[project]
name = "arango-cypher-py"
version = "0.2.0"
description = "Python-native Cypher to AQL transpiler for ArangoDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  # The conceptual↔physical mapping contract, OWL round-trip, and the
  # language-agnostic NL engine (providers/fewshot/seams) — carved out of
  # this repo into its own distribution (step 2 of the nl-engine
  # extraction; see arango-sparql-py/docs/architecture/proposals/).
  # Published on PyPI (0.2.0, 2026-08-22; adds nl.postconditions, the
  # shared mechanism `nl2cypher.postconditions` re-exports). For
  # co-development against the sibling checkout, `pip install -e
  # ../arango-query-core` first — pip skips index resolution when the
  # requirement is already satisfied.
  "arango-query-core>=0.2.0,<0.3.0",
  "python-arango>=8.1.1",
  "antlr4-python3-runtime",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/arango-solutions/arango-cypher-py"
Repository = "https://github.com/arango-solutions/arango-cypher-py"
Issues = "https://github.com/arango-solutions/arango-cypher-py/issues"

[project.optional-dependencies]
analyzer = [
  # Canonical spelling of the analyzer pin. Every other extra that
  # needs the analyzer references this one via `arango-cypher-py[analyzer]`
  # so there is a single source of truth (PEP 621 / PEP 735
  # self-referencing extras — supported by pip, uv, and hatchling).
  #
  # Band tracks the analyzer's current minor, and MUST stay aligned with
  # arango-sparql-py's. The two are co-installed (CDF's query path, any
  # sibling dev venv), and mutually exclusive bands are unsatisfiable: a
  # `<0.10` ceiling here silently DOWNGRADES a co-installed 0.12 and breaks
  # its consumers. Observed 2026-09-06; see
  # contextual-data-fabric/docs/research/unified-ontology-mapping-architecture.md
  # §3.1 and step 0 of §9.
  #
  # This package consumes five analyzer symbols, all additive across
  # 0.9 -> 0.12 and none of them the 0.12 tool-contract additions
  # (entityStrategy / detectForeignKeys): `fingerprint_physical_shape`,
  # `fingerprint_physical_counts`, `AgenticSchemaAnalyzer`, `export_mapping`,
  # and `owl_export.export_conceptual_model_as_owl_turtle`. The 0.9.0
  # features the previous floor cited (named-graph membership, graphScope,
  # CSI v1, GraphRAG detection, gold/metric-history) are all still present.
  # 0.13 adds bitemporal provenance (§3.13.5: transactionTime / validTime /
  # validTimeSource / predecessorFingerprint) that the CDF reverse-CSI export
  # consumes; none of the five symbols above changed. 0.14 converges LPG
  # type detection on the analyzer (tier-1 acceptance, `@type`/`entity_type`/
  # `category`/`predicate` candidates, `_fromType`/`_toType` endpoint
  # resolution) — the detector this package's schema_acquire.py will defer to;
  # again none of the five symbols changed (fast suite green on 0.14.0). The
  # band spans 0.12–0.14 so a co-installed arango-sparql-py on any of those
  # minors still resolves — raised together with its band on 2026-09-14 (0.13)
  # and 2026-09-15 (0.14) under the docs/PRD.md band invariant.
  "arangodb-schema-analyzer>=0.12.1,<0.15.0",
]
service = [
  # Headless service installs (ServiceMaker / Container Manager /
  # `pip install '.[service]'`) need the analyzer at module-load time
  # via `arango_cypher.service._require_analyzer_unless_opted_out`;
  # without it the import errors out unless deployers manually set
  # `ARANGO_CYPHER_ALLOW_HEURISTIC=1`. Referenced rather than
  # re-pinned so the [analyzer] band stays the single source of truth.
  "arango-cypher-py[analyzer]",
  "typer>=0.9.0",
  "rich>=13.0.0",
]
cli = [
  "typer>=0.9.0",
  "rich>=13.0.0",
]
owl = [
  # Same band arango-query-core's [owl] extra pins; spelled here too so
  # `pip install 'arango-cypher-py[owl]'` keeps working unchanged.
  "rdflib>=7.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  # Pinned to match the CI lint gate exactly (.github/workflows/ci.yml);
  # bump both together. A floor-only spec lets local and CI format differently.
  "ruff==0.16.4",
  # Pinned with the CI typecheck job (.github/workflows/ci.yml); bump both together.
  "mypy==2.3.1",
  "antlr4-tools",
  "PyYAML>=6.0.0",
  "httpx>=0.24.0",
  "rank_bm25>=0.2.2",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.20.0",
  # Same analyzer band as [analyzer] / [service] — referenced rather
  # than duplicated.
  "arango-cypher-py[analyzer]",
  # Included so the 14 CLI tests gated on `typer_available` run under the
  # default `pip install -e '.[dev]'` developer bootstrap. Without this the
  # CLI module has no CI coverage on the default dev path.
  "typer>=0.9.0",
]
neo4j = [
  "neo4j>=5.0",
]

# BYOC release configuration for arango-byoc-deploy (docs/byoc-deployment.md).
# Only what differs from the shared deployer's defaults lives here.
[tool.arango-byoc]
app-name = "arango-cypher-py"
instance = "arango-cypher-py"
display-name = "Arango Cypher Workbench"
description = "openCypher → AQL translation, NL → Cypher, and a query Workbench."
# prod.demo offers node22base, py12base, py12cugraph, py12torch, test.
base-image = "py12base"
tarball = "arango-cypher-byoc.tar.gz"
required-members = ["entrypoint", "pyproject.toml", "uv.lock", "ui/dist/index.html"]
index-html = "ui/dist/index.html"
# package-byoc.sh bakes ROOT_PATH from SERVICE_ROOT_PATH; the deploy env map
# cannot carry it (the platform drops app env there).
prefix-env-var = "ROOT_PATH"
# After `release`, the live service must report the release it was given.
version-probe = { path = "/openapi.json", json-key = "info.version" }
probes = [
  { path = "/health", label = "health", expect-json-key = "status" },
  { path = "/openapi.json", label = "API" },
  { path = "/connections", label = "service" },
  { path = "/frontend", label = "Workbench" },
  # Floor, not exact: catches a bundle shipped without tests/fixtures/datasets,
  # which answers 200 with an empty list.
  { path = "/sample-queries", label = "sample queries", expect-json-key = "queries", min-items = 40 },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a running ArangoDB (see README); isolated profile tests use docker-compose.pytest.yml on port 28530",
  "tck: openCypher TCK harness and runners",
  "cross: cross-validates translated AQL against a reference Cypher engine (Neo4j); requires a running Neo4j (see docker-compose.neo4j.yml) plus RUN_INTEGRATION=1 and RUN_CROSS=1",
  "live: executes against a real remote service (ArangoDB, or an LLM API); opt-in via RUN_LIVE=1, then also needs the relevant ARANGO_* / API-key env. Credential presence alone never enables them.",
]

# Whole package, not a scoped subset: it was brought to zero errors in one
# pass, and a partial scope quietly leaves new modules unchecked. The ANTLR
# output is generated code. python-arango's union return types are narrowed
# once, in arango_cypher/_arango_sync.py, rather than ignored per call site.
[tool.mypy]
packages = ["arango_cypher"]
exclude = ["arango_cypher/_antlr/"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
  "arango_cypher/_antlr",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401", "F841"]
"scripts/**/*.py" = ["E402"]
# Audit-v2 #8 split: ``arango_cypher/service/__init__.py`` is a re-export
# shim — every ``from .submodule import _X`` is intentional surface that
# preserves the pre-split ``from arango_cypher.service import _X`` contract
# for tests / scripts / external callers. Adding every underscore name to
# ``__all__`` would be misleading (these are not "public API"; they're
# re-exported only for backward compat) so we ignore F401 instead. E402
# covers the deliberate ordering: the ``sys.modules`` purge has to run
# *before* the submodule imports or it would invalidate them.
"arango_cypher/service/__init__.py" = ["F401", "E402"]

[project.scripts]
arango-cypher-py = "arango_cypher.cli:app"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

# Deploy tooling, kept out of the published package's metadata (a dependency
# group is never part of the wheel), so a git pin here cannot break a PyPI
# release. Pinned to an exact commit until arango-byoc-deploy is on PyPI; bump
# the rev deliberately. Run: uv run --group deploy arango-byoc-deploy <command>
[dependency-groups]
deploy = ["arango-byoc-deploy"]

[tool.uv.sources]
arango-byoc-deploy = { git = "https://github.com/ArthurKeen/arango-byoc-deploy", rev = "0006881506ce079af15170ee6c81e211596bca81" }

[tool.hatch.build.targets.wheel]
packages = ["arango_cypher"]

