# Ephemeral databases for the LDBC SNB suites and tools (tests/ldbc/stack.py).
#
# Started and torn down (`down -v`) around each run by tests/ldbc/stack.py — not
# meant to stay up. Ports are distinct from the dev instance (28529,
# docker-compose.yml), the pytest instance (28530) and the cross-validation
# Neo4j (27687), so a run never touches a database someone else is using.
#
# Memory is capped: the Docker VM is shared, and uncapped Neo4j/ArangoDB were
# OOM-killed by the VM (exit 137) mid-run. ArangoDB sizes its caches from the
# memory it detects, so the override keeps it inside its limit; Neo4j's heap and
# page cache are sized for SF0.003–SF0.1. Raise both for SF1+ benchmark runs.
#
#   docker compose -f docker-compose.ldbc.yml -p arango_cypher_ldbc up -d --wait
#   docker compose -f docker-compose.ldbc.yml -p arango_cypher_ldbc down -v
#
services:
  arangodb:
    image: arangodb/arangodb:3.11
    environment:
      - ARANGO_ROOT_PASSWORD=openSesame
      - ARANGODB_OVERRIDE_DETECTED_TOTAL_MEMORY=1536M
    mem_limit: 2g
    ports:
      - "28531:8529"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget -qO- --header=\"Content-Type: application/json\" --post-data \"{\\\"username\\\":\\\"root\\\",\\\"password\\\":\\\"$$ARANGO_ROOT_PASSWORD\\\"}\" http://127.0.0.1:8529/_open/auth >/dev/null 2>&1",
        ]
      interval: 3s
      timeout: 2s
      retries: 40

  neo4j:
    # Keep in step with docker-compose.neo4j.yml: the oracle snapshots are recorded on it.
    image: neo4j:5.26.27-community
    environment:
      - NEO4J_AUTH=neo4j/openSesame
      - NEO4J_PLUGINS=[]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    mem_limit: 1536m
    ports:
      - "27688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p openSesame 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
