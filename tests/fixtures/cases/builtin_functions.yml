  expected:
    aql: "FOR n IN @@collection\n  RETURN (IS_NUMBER(n.score) ? n.score : (IS_STRING(n.score) ? (REGEX_TEST(n.score, '^ *[+-]?([0-9]+[.]?[0-9]*|[.][0-9]+)([eE][+-]?[0-9]+)? *$') ? TO_NUMBER(n.score) : null) : null))\n"
    bind_vars:
      "@collection": persons
