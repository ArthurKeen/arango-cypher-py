version: 1
cases:
- id: C235
  name: return id function
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person) RETURN id(n)

    '
  expected:
    aql: "FOR n IN @@collection\n  RETURN n._id\n"
    bind_vars:
      '@collection': persons
- id: C236
  name: return keys function
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person) RETURN keys(n)

    '
  expected:
    aql: "FOR n IN @@collection\n  RETURN (IS_OBJECT(n) AND HAS(n, '_id') ? ATTRIBUTES(n)[* FILTER CURRENT NOT IN [\"_id\", \"_key\", \"_rev\", \"_from\", \"_to\"]] : ATTRIBUTES(n))\n"
    bind_vars:
      "@collection": persons
- id: C237
  name: return properties function
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person) RETURN properties(n)

    '
  expected:
    aql: "FOR n IN @@collection\n  RETURN (IS_OBJECT(n) AND HAS(n, '_id') ? UNSET(n, [\"_id\", \"_key\", \"_rev\", \"_from\", \"_to\"]) : n)\n"
    bind_vars:
      "@collection": persons
- id: C238
  name: return toString function
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person) RETURN toString(n.age)

    '
  expected:
    aql: "FOR n IN @@collection\n  RETURN ((n.age == null) ? null : TO_STRING(n.age))\n"
    bind_vars:
      "@collection": persons
- id: C239
  name: return toInteger function
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person) RETURN toInteger(n.ageStr)

    '
  expected:
    aql: "FOR n IN @@collection\n  RETURN (IS_NUMBER(n.ageStr) ? ((n.ageStr >= 0) ? FLOOR(n.ageStr) : CEIL(n.ageStr)) : (IS_STRING(n.ageStr) ? (REGEX_TEST(n.ageStr, '^ *[+-]?([0-9]+[.]?[0-9]*|[.][0-9]+)([eE][+-]?[0-9]+)? *$') ? ((TO_NUMBER(n.ageStr) >= 0) ? FLOOR(TO_NUMBER(n.ageStr)) : CEIL(TO_NUMBER(n.ageStr))) : null) : (IS_BOOL(n.ageStr) ? TO_NUMBER(n.ageStr) : null)))\n"
    bind_vars:
      "@collection": persons
- id: C240
  name: regression toUpper in where
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person) WHERE toUpper(n.name) = "ALICE" RETURN n

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER (UPPER(n.name) == \"ALICE\")\n  RETURN n\n"
    bind_vars:
      '@collection': persons
- id: C241
  name: regression size in where
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person) WHERE size(n.friends) > 3 RETURN n

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER (LENGTH(n.friends) != null AND LENGTH(n.friends) > 3)\n  RETURN n\n"
    bind_vars:
      '@collection': persons
