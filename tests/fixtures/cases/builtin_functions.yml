  extensions_enabled: false
  cypher: 'MATCH (n:Person) RETURN toBoolean(n.active)

    '
  expected:
    aql: "FOR n IN @@collection\n  RETURN (IS_BOOL(n.active) ? n.active : (IS_STRING(n.active) ? ((LOWER(TRIM(n.active)) == 'true') ? true : ((LOWER(TRIM(n.active)) == 'false') ? false : null)) : (IS_NUMBER(n.active) ? (n.active != 0) : null)))\n"
    bind_vars:
      "@collection": persons
