version: 1
cases:
- id: C835
  name: toInteger of a property truncates toward zero, checking the value's type at run time
  mapping_fixture: ldbc_pg
  extensions_enabled: false
  cypher: MATCH (m:Post) RETURN toInteger(m.length) AS n, toFloat(m.length) AS f
  expected:
    aql: "FOR m IN @@collection\n  RETURN {n: (IS_NUMBER(m.length) ? ((m.length >= 0) ? FLOOR(m.length) : CEIL(m.length)) : (IS_STRING(m.length) ? (REGEX_TEST(m.length, '^ *[+-]?([0-9]+[.]?[0-9]*|[.][0-9]+)([eE][+-]?[0-9]+)? *$') ? ((TO_NUMBER(m.length) >= 0) ? FLOOR(TO_NUMBER(m.length)) : CEIL(TO_NUMBER(m.length))) : null) : (IS_BOOL(m.length) ? TO_NUMBER(m.length) : null))), f: (IS_NUMBER(m.length) ? m.length : (IS_STRING(m.length) ? (REGEX_TEST(m.length, '^ *[+-]?([0-9]+[.]?[0-9]*|[.][0-9]+)([eE][+-]?[0-9]+)? *$') ? TO_NUMBER(m.length) : null) : null))}\n"
    bind_vars:
      "@collection": post
- id: C836
  name: toString keeps null
  mapping_fixture: ldbc_pg
  extensions_enabled: false
  cypher: MATCH (p:Person) RETURN toString(p.id) AS id, toString(p.firstName) AS name
  expected:
    aql: "FOR p IN @@collection\n  RETURN {id: ((p.id == null) ? null : TO_STRING(p.id)), name: ((p.firstName == null) ? null : TO_STRING(p.firstName))}\n"
    bind_vars:
      "@collection": person
- id: C837
  name: an untyped argument is converted by its type at run time
  mapping_fixture: pg
  extensions_enabled: false
  cypher: MATCH (n:User) RETURN toInteger(n.x) AS i, toBoolean(n.y) AS b
  expected:
    aql: "FOR n IN @@collection\n  RETURN {i: (IS_NUMBER(n.x) ? ((n.x >= 0) ? FLOOR(n.x) : CEIL(n.x)) : (IS_STRING(n.x)\
      \ ? (REGEX_TEST(n.x, '^ *[+-]?([0-9]+[.]?[0-9]*|[.][0-9]+)([eE][+-]?[0-9]+)? *$') ? ((TO_NUMBER(n.x) >= 0)\
      \ ? FLOOR(TO_NUMBER(n.x)) : CEIL(TO_NUMBER(n.x))) : null) : (IS_BOOL(n.x) ? TO_NUMBER(n.x) : null))), b: (IS_BOOL(n.y)\
      \ ? n.y : (IS_STRING(n.y) ? ((LOWER(TRIM(n.y)) == 'true') ? true : ((LOWER(TRIM(n.y)) == 'false') ? false\
      \ : null)) : (IS_NUMBER(n.y) ? (n.y != 0) : null)))}"
    bind_vars:
      '@collection': users
- id: C838
  name: an aggregate's argument compiles like any expression
  mapping_fixture: ldbc_pg
  extensions_enabled: false
  cypher: MATCH (m:Post) RETURN sum(toInteger(m.length)) AS total, count(DISTINCT toString(m.id)) AS ids
  expected:
    aql: "FOR m IN @@collection\n  COLLECT AGGREGATE _total_sum = SUM((IS_NUMBER(m.length) ? ((m.length >= 0) ? FLOOR(m.length) : CEIL(m.length)) : (IS_STRING(m.length) ? (REGEX_TEST(m.length, '^ *[+-]?([0-9]+[.]?[0-9]*|[.][0-9]+)([eE][+-]?[0-9]+)? *$') ? ((TO_NUMBER(m.length) >= 0) ? FLOOR(TO_NUMBER(m.length)) : CEIL(TO_NUMBER(m.length))) : null) : (IS_BOOL(m.length) ? TO_NUMBER(m.length) : null)))), _ids_distinct = COUNT_DISTINCT(((m.id == null) ? null : TO_STRING(m.id))), _ids_has_null = MAX((((m.id == null) ? null : TO_STRING(m.id))) == null ? 1 : 0)\n  LET total = NOT_NULL(_total_sum, 0)\n  LET ids = _ids_distinct - NOT_NULL(_ids_has_null, 0)\n  RETURN {total: total, ids: ids}\n"
    bind_vars:
      "@collection": post
