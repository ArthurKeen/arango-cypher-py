version: 1
cases:
- id: C600
  name: OPTIONAL MATCH with comma-separated pattern parts
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (a:User) OPTIONAL MATCH (a)-[:FOLLOWS]->(b:User), (a)-[:FOLLOWS]->(c:Person) RETURN a.name, b.name, c.name

    '
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@collection\nFOR a IN @@collection\n  LET _opt_rows =\
      \ (\n  FOR b, r IN 1..1 OUTBOUND a @@edgeCollection\n    FILTER IS_SAME_COLLECTION(@vCollection, b)\n    FOR c, r_1 IN 1..1\
      \ OUTBOUND a @@edgeCollection2\n      FILTER IS_SAME_COLLECTION(@vCollection2, c)\n      RETURN {b: b, c: c}\n      )\n\
      \      FOR _opt_row IN (LENGTH(_opt_rows) > 0 ? _opt_rows : [{}])\n        LET b = _opt_row.b\n        LET c = _opt_row.c\n\
      \        RETURN {name: a.name, b_name: b.name, c_name: c.name}"
    bind_vars:
      '@collection': users
      '@edgeCollection': follows
      vCollection: users
      '@edgeCollection2': follows
      vCollection2: persons
      '@withCollection0': docs
      '@withCollection1': persons
      '@withCollection2': places
- id: C601
  name: OPTIONAL MATCH with comma-separated parts from traversal target
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (a:User)-[:FOLLOWS]->(b:User) OPTIONAL MATCH (b)-[:FOLLOWS]->(c:Person), (b)-[:FOLLOWS]->(d:Place) RETURN a.name, c.name, d.name

    '
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@uCollection\nFOR a IN @@uCollection\n  FOR b, r IN 1..1\
      \ OUTBOUND a @@edgeCollection\n    FILTER IS_SAME_COLLECTION(@vCollection, b)\n    LET _opt_rows = (\n    FOR c, r_1 IN\
      \ 1..1 OUTBOUND b @@edgeCollection2\n      FILTER IS_SAME_COLLECTION(@vCollection2, c)\n      FOR d, r_2 IN 1..1 OUTBOUND\
      \ b @@edgeCollection3\n        FILTER IS_SAME_COLLECTION(@vCollection3, d)\n        RETURN {c: c, d: d}\n        )\n   \
      \     FOR _opt_row IN (LENGTH(_opt_rows) > 0 ? _opt_rows : [{}])\n          LET c = _opt_row.c\n          LET d = _opt_row.d\n\
      \          RETURN {name: a.name, c_name: c.name, d_name: d.name}"
    bind_vars:
      '@uCollection': users
      '@edgeCollection': follows
      vCollection: users
      '@edgeCollection2': follows
      vCollection2: persons
      '@edgeCollection3': follows
      vCollection3: places
      '@withCollection0': docs
      '@withCollection1': persons
      '@withCollection2': places
