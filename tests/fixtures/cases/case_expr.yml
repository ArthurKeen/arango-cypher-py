version: 1
cases:
  - id: C225
    name: Generic CASE with ELSE in RETURN
    mapping_fixture: pg
    extensions_enabled: false
    cypher: |
      MATCH (n:User) RETURN CASE WHEN n.age > 18 THEN 'adult' WHEN n.age > 12 THEN 'teen' ELSE 'child' END AS category
    expected:
      aql: |-
        FOR n IN @@collection
          RETURN {category: ((n.age != null AND n.age > 18) ? 'adult' : ((n.age != null AND n.age > 12) ? 'teen' : 'child'))}
      bind_vars:
        "@collection": users

  - id: C226
    name: Simple CASE compares the test value in each ternary
    mapping_fixture: pg
    extensions_enabled: false
    cypher: |
      MATCH (n:User) RETURN CASE n.status WHEN 'active' THEN 1 WHEN 'inactive' THEN 0 ELSE -1 END AS code
    expected:
      aql: |-
        FOR n IN @@collection
          RETURN {code: ((n.status == 'active') ? 1 : ((n.status == 'inactive') ? 0 : (-1)))}
      bind_vars:
        "@collection": users

  - id: C227
    name: Generic CASE without ELSE
    mapping_fixture: pg
    extensions_enabled: false
    cypher: |
      MATCH (n:User) RETURN CASE WHEN n.active = true THEN 'yes' END AS status
    expected:
      aql: |-
        FOR n IN @@collection
          RETURN {status: ((n.active == true) ? 'yes' : null)}
      bind_vars:
        "@collection": users
