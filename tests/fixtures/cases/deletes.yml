- id: C851
  name: DELETE after OPTIONAL MATCH drops the unmatched nulls
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:User {id: ''u1''}) OPTIONAL MATCH (n)-[r:FOLLOWS]->(:User) DELETE r'
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@collection\nLET _matched = (\nFOR n IN @@collection\n  FILTER (n.id == 'u1')\n  LET _opt_rows = (\n  FOR v, r IN 1..1 OUTBOUND n @@edgeCollection\n    FILTER IS_SAME_COLLECTION(@vCollection, v)\n    RETURN {r: r}\n    )\n    FOR _opt_row IN (LENGTH(_opt_rows) > 0 ? _opt_rows : [{}])\n      LET r = _opt_row.r\n      RETURN {n: n, r: r, _row: true}\n      )\n      LET _deleted_rels = UNIQUE(REMOVE_VALUE(FLATTEN(_matched[*].r._id), null))\n      LET _deleted_edges = UNIQUE(_deleted_rels)\n      FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdgesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges\n"
    bind_vars:
      "@collection": users
      "@edgeCollection": follows
      vCollection: users
      "@deleteEdges": follows
      deleteEdgesName: follows
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
