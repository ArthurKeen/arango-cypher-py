deleteEdges15 RETURN _e._id)\n    LET _deleted_edges = UNIQUE(UNION(_detach0, _detach1, _detach2, _detach3, _detach4, _detach5, _detach6, _detach7, _detach8, _detach9, _detach10, _detach11, _detach12, _detach13, _detach14))\n    LET _removed0 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdgesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges)\n    LET _removed1 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges2Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges2)\n    LET _removed2 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges3Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges3)\n    LET _removed3 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges4Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges4)\n    LET _removed4 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges5Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges5)\n    LET _removed5 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges6Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges6)\n    LET _removed6 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges7Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges7)\n    LET _removed7 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges8Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges8)\n    LET _removed8 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges9Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges9)\n    LET _removed9 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges10Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges10)\n    LET _removed10 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges11Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges11)\n    LET _removed11 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges12Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges12)\n    LET _removed12 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges13Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges13)\n    LET _removed13 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges14Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges14)\n    LET _removed14 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdges15Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges15)\n    LET _removed15 = (FOR _id IN _deleted_nodes FILTER PARSE_IDENTIFIER(_id).collection == @deleteNodesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteNodes)\n    FOR _id IN _deleted_nodes FILTER PARSE_IDENTIFIER(_id).collection == @deleteNodes2Name REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteNodes2\n"
